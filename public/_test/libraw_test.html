<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>libraw-wasm ブラウザ検証</title>
<style>body{font-family:monospace;padding:20px;max-width:900px;margin:0 auto;background:#111;color:#0f0}
#log{white-space:pre-wrap;font-size:13px;line-height:1.6}.err{color:#f55}.ok{color:#5f5}.warn{color:#fd5}
canvas{max-width:400px;border:1px solid #0f0;margin-top:10px}</style></head>
<body>
<h2>libraw-wasm 実機検証 (GH5 RW2)</h2>
<div id="log">初期化中...\n</div>
<canvas id="cv"></canvas>
<script type="module">
const log = (m, cls='') => {
  const el = document.getElementById('log');
  el.innerHTML += cls ? `<span class="${cls}">${m}</span>\n` : m + '\n';
};

async function run(){
  try {
    log('1. libraw-wasm を CDN から import...');
    const t0 = performance.now();
    const mod = await import('https://cdn.jsdelivr.net/npm/libraw-wasm@1.6.0/dist/index.js');
    const LibRaw = mod.default;
    log('   ✅ import 成功', 'ok');

    log('2. GH5 RW2 (23MB) をfetch...');
    const resp = await fetch('./_test/gh5.rw2');
    const buf = new Uint8Array(await resp.arrayBuffer());
    log(`   ✅ ${(buf.length/1e6).toFixed(1)}MB 取得`, 'ok');

    log('3. リニア現像 (useCameraWb, 16bit, gamma=1, noAutoBright)...');
    const raw = new LibRaw();
    const tdec0 = performance.now();
    await raw.open(buf, {
      useCameraWb: true,
      outputBps: 16,
      outputColor: 1,     // sRGB
      gamm: [1, 1],       // リニア
      noAutoBright: true,
      halfSize: false,
    });
    const meta = await raw.metadata(true);
    const img = await raw.imageData();
    const tdec1 = performance.now();
    log(`   ✅ デコード成功 ${((tdec1-tdec0)/1000).toFixed(1)}秒`, 'ok');
    log(`   カメラ: ${meta.make} ${meta.model}`);
    log(`   解像度: ${meta.width} x ${meta.height}`);
    log(`   データ型: ${img.constructor.name}  長さ: ${img.length}`);
    log(`   期待値 w*h*3 = ${meta.width * meta.height * 3}  一致: ${img.length === meta.width*meta.height*3 ? '✅' : '❌'}`);

    // リニア性チェック: 16bit値の範囲
    let mx = 0, mn = 65535, sum = 0, cnt = 0;
    for (let i = 0; i < img.length; i += 331) { const v = img[i]; if(v>mx)mx=v; if(v<mn)mn=v; sum+=v; cnt++; }
    log(`   16bit値域: min=${mn} max=${mx} mean=${Math.round(sum/cnt)}`);
    log(`   ${mx > 255 ? '✅ 16bitフル階調 (RAW精度が保たれている)' : '⚠️ 8bit相当?'}`, mx > 255 ? 'ok' : 'warn');

    // 縮小プレビュー描画 (ガンマ2.2)
    log('4. プレビュー描画...');
    const scale = 8;
    const sw = Math.floor(meta.width/scale), sh = Math.floor(meta.height/scale);
    const cv = document.getElementById('cv'); cv.width = sw; cv.height = sh;
    const cx = cv.getContext('2d');
    const idata = cx.createImageData(sw, sh);
    for (let y = 0; y < sh; y++) {
      for (let x = 0; x < sw; x++) {
        const srcIdx = ((y*scale)*meta.width + (x*scale))*3;
        const di = (y*sw + x)*4;
        for (let c = 0; c < 3; c++) {
          const lin = img[srcIdx+c]/65535;
          idata.data[di+c] = Math.min(255, Math.pow(lin, 1/2.2)*255);
        }
        idata.data[di+3] = 255;
      }
    }
    cx.putImageData(idata, 0, 0);
    log('   ✅ 描画完了', 'ok');

    const total = ((performance.now()-t0)/1000).toFixed(1);
    log(`\n=== 総合: ✅ ブラウザ完結でRW2デコード成功 (総${total}秒) ===`, 'ok');
    log('結論: LXCサーバー不要。GitHub Pages + Supabaseだけで RAW精度を維持できる。', 'ok');

    raw.dispose?.();
  } catch(e) {
    log('\n❌ 失敗: ' + e.message, 'err');
    log('stack: ' + (e.stack||'').slice(0,500), 'err');
    log('\n結論: ブラウザ完結は不可。サーバー版(既存コード)を使う必要がある。', 'warn');
  }
}
run();
</script>
</body>
</html>
